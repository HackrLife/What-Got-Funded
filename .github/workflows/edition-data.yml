name: Edition data
# Push a day to site/data/editions/REQUEST (one YYYY-MM-DD per line) and this saves that released edition's rounds
# to site/data/editions/<day>.json, for the newsletter build (node site/newsletter.mjs <day>).
on:
  push:
    paths: ["site/data/editions/REQUEST"]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch released editions
        run: |
          for day in $(grep -Eo '^[0-9]{4}-[0-9]{2}-[0-9]{2}' site/data/editions/REQUEST); do
            curl -sSf "https://cxtcwslqzrzjaulqcvvu.supabase.co/functions/v1/wgf-publish?edition=$day" -o "site/data/editions/$day.json"
            python3 -c "import json,sys;d=json.load(open(sys.argv[1]));print(sys.argv[1], d['generated_at'], len(d['rounds']))" "site/data/editions/$day.json"
          done
      - name: Commit
        run: |
          git config user.name "wgf-bot"; git config user.email "wgf-bot@users.noreply.github.com"
          git add site/data/editions/*.json
          git diff --cached --quiet || git commit -m "Edition data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
